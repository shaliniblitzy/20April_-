# =============================================================================
# PEP 621 project metadata for the Flask scaffold.
#
# Anchored by:
#   - AAP §0.4.1  — transformation table row for `pyproject.toml`
#   - AAP §0.5.1  — key packages (Flask 3.1.3, gunicorn 26.0.0, python-dotenv)
#   - AAP §0.8.4  — web sources cited
#
# Runtime contract:
#   - requires-python = ">=3.10"  (gunicorn 26.0.0 imposes the floor;
#                                   Flask 3.1.x itself supports >=3.9)
#   - setuptools build backend (per Flask packaging tutorial recommendation)
#
# Tool configuration co-located here per modern Python convention:
#   - ruff   (lint + format)
#   - pytest (test discovery & execution)
#   - mypy   (static type-checking)
#
# No source counterpart exists in the repository [tech-spec:§1.2]; every
# block below is authored from the AAP's stated contract.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata (PEP 621)
# -----------------------------------------------------------------------------
# `name` MUST be a valid PEP 503 distribution name. The original repository
# name `20April_-` starts with a digit and contains a trailing hyphen, which
# is not a valid Python distribution name; `twenty-april-flask-scaffold` is
# used as the distribution name and the original repository name appears in
# `[project.urls]` and the README instead.
#
# `license` is intentionally omitted: the user provided no rules (AAP §0.7.1)
# and no LICENSE file exists in the repository, so any value would be a guess.
# -----------------------------------------------------------------------------
[project]
name = "twenty-april-flask-scaffold"
version = "0.1.0"
description = "Python 3 + Flask scaffold awaiting port of the original Node.js server. See README.md for status."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["flask", "scaffold", "wsgi", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "Flask>=3.1.3",
    "gunicorn>=26.0.0",
    # python-dotenv >= 1.2.2 is required to exclude releases affected by
    # CVE-2026-28684 (symlink-following arbitrary file overwrite in
    # `set_key()` / `unset_key()`; published 2026-04-20). The lower bound
    # MUST stay at 1.2.2 or higher in both this file and `requirements.txt`.
    "python-dotenv>=1.2.2",
]

# -----------------------------------------------------------------------------
# Optional dependency groups.
# `dev` mirrors `requirements-dev.txt` exactly so `pip install -e ".[dev]"` is
# a drop-in equivalent of `pip install -r requirements-dev.txt`. Any package
# added or removed in `requirements-dev.txt` MUST also be added or removed
# here; the comment at the top of `requirements-dev.txt` documents this
# parity contract.
# -----------------------------------------------------------------------------
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    # Coverage tooling — kept in lock-step with `requirements-dev.txt` so the
    # two installation paths produce identical environments.
    "coverage[toml]>=7.6",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/shaliniblitzy/20April_-"

# -----------------------------------------------------------------------------
# setuptools — package discovery
# -----------------------------------------------------------------------------
# Only the `app/` package and its sub-packages are shipped in built
# distributions; the `tests/` tree is excluded. While `app/` is empty in the
# scaffold-only state, this declaration becomes effective automatically once
# the source-generation agent materialises `app/__init__.py`.
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

# -----------------------------------------------------------------------------
# ruff — lint + format
#
# Rule families enabled (per AAP-adjacent agent prompt for this file):
#   E   — pycodestyle errors
#   F   — pyflakes (undefined names, unused imports)
#   W   — pycodestyle warnings
#   I   — isort (import sorting)
#   UP  — pyupgrade (modern syntax for the configured target-version)
#   B   — flake8-bugbear (likely bugs and design problems)
#   C4  — flake8-comprehensions (idiomatic list/set/dict comprehensions)
#   SIM — flake8-simplify (simpler equivalent constructs)
#
# `E501` (line length) is delegated to the formatter; the rule is disabled
# so the formatter remains the single source of truth for line widths.
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may import after `sys.path` manipulation or fixture setup; allow it.
"tests/*" = ["E402"]
# Package initialisers commonly re-export symbols; tolerate the F401
# "imported but unused" pattern (important for `app/blueprints/__init__.py`).
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# pytest — discovery & execution
#
# `--strict-markers` and `--strict-config` make typos in markers/config a
# hard error rather than a silent warning. `filterwarnings = ["error", ...]`
# turns runtime warnings into test failures except for the known Flask
# DeprecationWarning channel.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:flask.*",
]

# -----------------------------------------------------------------------------
# mypy — static type-checking
#
# Started in a permissive posture (`disallow_untyped_defs = false`) so the
# scaffold compiles cleanly while the source-generation agent ports the
# original Node.js server; tighten once typed view functions are present.
# `ignore_missing_imports = true` keeps mypy quiet about third-party packages
# that do not ship `py.typed` markers (gunicorn, etc.).
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "\\.venv/", "venv/"]
