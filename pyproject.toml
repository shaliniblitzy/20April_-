# =============================================================================
# PEP 621 project metadata for the Flask scaffold.
#
# Mirrors the AAP §0.4.1 / §0.5.1 contract:
#   - requires-python = ">=3.10"  (gunicorn 26.0.0 floor; Flask 3.1.x also OK)
#   - Pinned runtime deps match requirements.txt
#
# The setuptools backend is declared so a `pip install .` (editable or
# regular) can build the source distribution once the `app/` package is
# populated by the source-generation agent.
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twentyapril-flask-scaffold"
version = "0.1.0"
description = "Flask scaffold for the Python 3 migration of the 20April_- Node.js server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "20April_- Maintainers" }]
keywords = ["flask", "wsgi", "scaffold", "migration"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
    "Flask>=3.1.3,<4",
    "gunicorn>=26.0.0,<27",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/shaliniblitzy/20April_-"

# -----------------------------------------------------------------------------
# setuptools-specific configuration
# -----------------------------------------------------------------------------
[tool.setuptools]
# Wait for the source-generation agent to materialise the `app/` package
# before letting setuptools auto-discover it. Empty include here keeps
# `pip install .` viable as a no-op for the scaffold-only state.
packages = []

# -----------------------------------------------------------------------------
# ruff — lint + format
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # allow `assert False` style in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # PytestConfigWarning fires when `tests/` is empty/missing — expected in the
    # scaffold-only state before the source-generation agent has populated tests.
    "ignore::pytest.PytestConfigWarning",
]

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build/", "dist/", "\\.venv/", "venv/"]
